<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <h2>CampusPulse</h2>

        <a href="/">Home</a>
    </nav>

    <div class="container">

        <h1>Submitted Complaints</h1>
        <div class="stats-container">

    <div class="stat-card">
        <h3>Total Issues</h3>
        <p>{{ total_issues }}</p>
    </div>

    <div class="stat-card">
        <h3>Pending</h3>
        <p>{{ pending_issues }}</p>
    </div>

    <div class="stat-card">
        <h3>Resolved</h3>
        <p>{{ resolved_issues }}</p>
    </div>

</div>

        {% for complaint in complaints %}

        <div class="card">

    <div class="top-row">

        <span class="category">
            {{ complaint[3] }}
        </span>

        <span class="status">
            {{ complaint[4] }}
        </span>

    </div>

    <h2>{{ complaint[1] }}</h2>

    <p>{{ complaint[2] }}</p>

</div>

        {% endfor %}

    </div>

</body>
</html>
